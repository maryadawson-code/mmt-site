name: Weekly Auto-Repair PR

# Runs every Sunday night at 11 PM ET (4 AM UTC Mon).
# Applies safe auto-repairs and opens a PR for human review.
# Never pushes directly to main.
#
# This is Layer 3 of the autonomous self-monitoring stack.

on:
  schedule:
    - cron: '0 4 * * 1'    # 11 PM ET Sunday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run auto-repair
        id: repair
        run: node scripts/auto-repair.js --apply

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Run build to verify nothing broke
        if: steps.changes.outputs.has_changes == 'true'
        run: node build.js

      - name: Run audit to verify cleanliness
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/content-freshness-audit.js

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: '[auto-repair] Weekly content freshness fixes'
          title: '[auto-repair] Weekly content freshness fixes'
          body: |
            ## Auto-Repair PR

            This PR applies safe automatic fixes from `scripts/auto-repair.js`.

            **Repairs applied:**
            - Stale "Assessment as of [old month]" dates bumped to current month
            - Copyright year bumped if outdated
            - `contracts.json` `last_verified` dates refreshed (>60 days old)
            - Broken glossary cross-link patterns fixed

            **Validation:**
            - Build passed
            - Content freshness audit clean

            **Review:**
            Review the diff and merge if everything looks correct. The script
            only applies unambiguous, reversible fixes — anything requiring
            judgment is left for the daily freshness issue.

            _Generated by `.github/workflows/weekly-auto-repair-pr.yml`_
          branch: auto-repair/weekly
          delete-branch: true
          labels: auto-repair
