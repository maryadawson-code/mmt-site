name: Contract Tracker re-verify

# Genuine, sourced re-verification of the hand-maintained contracts.json LISTING
# facts (status / value / last_verified). Runs weekly, checks each entry against
# SAM.gov Opportunities + USASpending, and opens a PR for human review.
# NEVER commits to main directly.
#
# This replaces the removed auto-repair "REPAIR 3", which faked freshness by
# bumping last_verified with no re-verification. See CLAUDE.md 2026-08-17 sprint.
#
# Requires the SAM_GOV_API_KEY repository secret for the SAM path (USASpending
# needs no auth). With no key the run is a safe no-op (nothing gets a signal, so
# nothing is written).

on:
  schedule:
    - cron: '0 5 * * 1'    # Mondays 05:00 UTC (~1 AM ET), offset from auto-repair (04:00)
  workflow_dispatch:
    inputs:
      max_sam:
        description: 'Max SAM lookups this run (SAM has a small shared daily quota)'
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: write

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Re-verify contract tracker listings
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: node scripts/reverify-contract-tracker.js --apply --max "${{ github.event.inputs.max_sam || '20' }}"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain contracts.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify build + tracker validation
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          node build.js
          node scripts/validate-contract-tracker.js

      - name: Open review PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: '[reverify] Contract Tracker status refresh'
          title: '[reverify] Contract Tracker status refresh'
          body: |
            ## Contract Tracker re-verification

            `scripts/reverify-contract-tracker.js` checked tracked contracts
            against SAM.gov Opportunities + USASpending and proposes the status
            changes in this diff. `last_verified` is bumped ONLY for entries that
            were actually checked against a live source this run.

            **Review before merging.** SAM matching is best-effort — confirm each
            status change against the linked source. Entries with no live signal
            were left untouched (still flagged by the build freshness audit and
            the weekly intel-quality-report email), so they need manual
            re-verification.

            _Generated by `.github/workflows/contract-tracker-reverify.yml`_
          branch: reverify/contract-tracker
          delete-branch: true
          labels: reverify
