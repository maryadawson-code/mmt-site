name: Deploy Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build 2>&1 | tee build.log
      - name: Check for build errors
        run: |
          if grep -iE "^error|fatal|ENOENT|Cannot find" build.log; then
            echo "::error::Build has errors"
            exit 1
          fi
      - name: Verify critical HTML files
        run: |
          EXPECTED=(
            "dist/index.html"
            "dist/about.html"
            "dist/proposal-pulse.html"
            "dist/tactical-brief.html"
            "dist/contract-tracker.html"
            "dist/newsletter.html"
            "dist/security.html"
            "dist/terms.html"
            "dist/privacy.html"
            "dist/getting-started.html"
          )
          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::MISSING: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then exit 1; fi
          echo "All critical files present"

  post-deploy-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify
        run: sleep 300
      - name: Health check
        env:
          HEALTH_URL: https://missionmeetstech.com/.netlify/functions/health
        run: |
          # health.js says "healthy" | "degraded" | "unhealthy" (HTTP 200/200/503).
          # This step used to wait for "UP", a word the endpoint never says, so it
          # failed on every push to main and a real failure had nowhere to show.
          # Anything outside the three known words fails closed and names itself,
          # so a vocabulary change cannot pass for a site problem again.
          # tests/unit/deploy-gate-health-step.test.js runs this exact script
          # against the real handler, because this job never runs on a PR.
          CODE=$(curl -sf --max-time 30 -o health.json -w '%{http_code}' "$HEALTH_URL") || {
            if [ "${CODE:-000}" = "000" ]; then
              echo "::error::Health endpoint not reached (no HTTP response). That is not a verdict on the site."
            else
              echo "::error::Health endpoint returned HTTP $CODE (503 is health.js reporting unhealthy)"
            fi
            exit 1
          }
          jq . health.json || true
          STATUS=$(jq -r '.status // empty' health.json 2>/dev/null) || STATUS=""
          case "$STATUS" in
            healthy)
              echo "Health: healthy"
              ;;
            degraded)
              echo "::warning::Health is degraded. The site is up (HTTP 200); see the checks above."
              ;;
            unhealthy)
              echo "::error::Health is unhealthy"
              exit 1
              ;;
            *)
              echo "::error::Health status was '${STATUS:-<empty>}'. Expected healthy, degraded, or unhealthy. If health.js changed its words, change this step with it."
              exit 1
              ;;
          esac
      - name: Critical page check
        run: |
          # /tactical-brief.html has been a forced 301 to /marketpulse.html since
          # 2026-03-19 (_redirects). This loop wants a 200, and it sat behind the
          # always-failing health step, so it never ran to say so.
          for p in "" "proposal-pulse.html" "marketpulse.html" "about.html" "contract-tracker.html"; do
            CODE=$(curl -so /dev/null -w "%{http_code}" "https://missionmeetstech.com/$p")
            if [ "$CODE" != "200" ]; then
              echo "::error::/$p returned $CODE"
              exit 1
            fi
          done
          echo "All critical pages OK"
