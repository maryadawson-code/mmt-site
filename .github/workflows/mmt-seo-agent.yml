name: MMT SEO Intelligence Agent
on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - audit-only

permissions:
  contents: write
  issues: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git for agent commits
        run: |
          git config user.name "MMT SEO Agent"
          git config user.email "seo-agent@missionmeetstech.com"

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq curl python3

      - name: Run shell audit
        run: |
          chmod +x scripts/mmt-seo-agent.sh
          bash scripts/mmt-seo-agent.sh --json > /tmp/mmt-seo-audit.json 2>&1 || true
          cat /tmp/mmt-seo-audit.json

      - name: Run SEO Intelligence Agent (Claude Code)
        run: |
          npm install -g @anthropic-ai/claude-code 2>/dev/null || true

          MODE="${{ github.event.inputs.mode || 'full' }}"
          AUDIT_FLAG=""
          [ "$MODE" = "audit-only" ] && AUDIT_FLAG="--audit"

          chmod +x scripts/mmt-seo-runner.sh
          PROJECT_DIR="${{ github.workspace }}" bash scripts/mmt-seo-runner.sh $AUDIT_FLAG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}

      - name: Push agent commits to repo
        run: |
          git push origin main || {
            echo "Push failed — fetching and rebasing"
            git fetch origin main
            git rebase origin/main
            git push origin main
          }

      - name: Upload run log as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-agent-run-${{ github.run_number }}
          path: .seo-agent/logs/
          retention-days: 30

      - name: Create run summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## MMT SEO Agent Run\n\n';
            try {
              const state = JSON.parse(fs.readFileSync('seo-agent/knowledge/page-state.json', 'utf8'));
              const grades = Object.entries(state.pages || {})
                .map(([page, data]) => `| ${page} | ${data.grade || '?'} | ${data.last_grade || '?'} |`)
                .join('\n');
              summary += `Run #${state.run_count}\n\n`;
              summary += `| Page | Grade | Previous |\n|------|-------|----------|\n${grades}\n\n`;
            } catch(e) {
              summary += 'Could not parse page state.\n';
            }
            core.summary.addRaw(summary);
            await core.summary.write();
