name: MMT Sentinel Performance Audit
on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse audits
        run: |
          mkdir -p /tmp/lighthouse
          for URL in "https://missionmeetstech.com/" "https://missionmeetstech.com/podcast" "https://missionmeetstech.com/newsletter"; do
            lhci collect --url="$URL" --outputDir=/tmp/lighthouse \
              --settings.onlyCategories="performance,accessibility,seo,best-practices" 2>&1 || true
          done

      - name: Create performance report issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('/tmp/lighthouse').filter(f => f.includes('lhr') && f.endsWith('.json'));
            let body = `## Monthly Performance Audit — ${new Date().toISOString().split('T')[0]}\n\n`;
            body += `| Page | Performance | Accessibility | SEO | Best Practices |\n|------|-------------|---------------|-----|----------------|\n`;
            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(`/tmp/lighthouse/${file}`, 'utf8'));
                const url = new URL(data.finalUrl || data.requestedUrl).pathname || '/';
                const perf = Math.round((data.categories?.performance?.score || 0) * 100);
                const a11y = Math.round((data.categories?.accessibility?.score || 0) * 100);
                const seo = Math.round((data.categories?.seo?.score || 0) * 100);
                const bp = Math.round((data.categories?.['best-practices']?.score || 0) * 100);
                body += `| ${url} | ${perf} | ${a11y} | ${seo} | ${bp} |\n`;
              } catch (e) {}
            }
            body += `\n_Alert threshold: Performance < 70, Accessibility < 90, SEO < 90_`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `📊 Monthly Performance Audit — ${new Date().toISOString().split('T')[0]}`,
              labels: ['sentinel-report', 'performance'],
              body
            });
