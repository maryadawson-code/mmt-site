name: MMT Sentinel Post-Deploy Verification
on:
  deployment_status:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CDN propagation
        run: sleep 20

      - name: Verify deployment
        id: verify
        run: |
          chmod +x scripts/mmt-health-check.sh
          bash scripts/mmt-health-check.sh --json

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🚨 Post-deploy verification failed — ${new Date().toISOString()}`,
              labels: ['sentinel-alert', 'deploy-failure'],
              body: `Deploy verification failed.\n\n**Commit:** ${context.sha}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nManual investigation required. Do NOT trigger another deploy until root cause is identified.`
            });
