<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMT Command Center</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e17; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; line-height: 1.5; }
    .auth-gate { display: none; }
    .dashboard { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid rgba(0,229,250,0.15); margin-bottom: 16px; }
    header h1 { font-size: 1.4rem; color: #00e5fa; font-weight: 700; }
    header .mode { padding: 4px 12px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; }
    .mode-normal { background: rgba(22,163,74,0.2); color: #22c55e; }
    .mode-degraded { background: rgba(234,179,8,0.2); color: #eab308; }
    .mode-readonly { background: rgba(249,115,22,0.2); color: #f97316; }
    .mode-emergency { background: rgba(239,68,68,0.2); color: #ef4444; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.75rem; font-weight: 600; }
    .badge-green { background: rgba(22,163,74,0.2); color: #22c55e; }
    .badge-yellow { background: rgba(234,179,8,0.2); color: #eab308; }
    .badge-red { background: rgba(239,68,68,0.2); color: #ef4444; }
    .badge-blue { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .badge-gray { background: rgba(107,114,128,0.2); color: #9ca3af; }
    .badge-purple { background: rgba(168,85,247,0.2); color: #a855f7; }
    .badge-orange { background: rgba(249,115,22,0.2); color: #f97316; }
    .badge-cyan { background: rgba(0,229,250,0.15); color: #00e5fa; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; padding: 6px 8px; color: rgba(255,255,255,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 500; }
    td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn-cyan { background: #00e5fa; color: #0a0e17; }
    .btn-red { background: #ef4444; color: white; }
    .btn-yellow { background: #eab308; color: #0a0e17; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .refresh-info { font-size: 0.75rem; color: rgba(255,255,255,0.3); }
    #loading { text-align: center; padding: 60px; color: rgba(255,255,255,0.4); }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #0a0e17; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; z-index: 9999; display: none; }
    .trunc { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .flag-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .revenue-big { font-size: 2.2rem; font-weight: 700; color: #22c55e; }
    .revenue-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); text-transform: uppercase; }

    /* Org filter bar */
    .org-filter { display: flex; gap: 8px; margin-bottom: 16px; }
    .org-filter button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
    .org-filter button.active { background: rgba(0,229,250,0.15); color: #00e5fa; border-color: rgba(0,229,250,0.3); }

    /* Tile grid */
    .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (min-width: 640px) { .tile-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .tile-grid { grid-template-columns: repeat(4, 1fr); } }
    .tile { background: #111827; border: 1px solid rgba(0,229,250,0.1); border-radius: 12px; padding: 20px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; }
    .tile:hover { transform: scale(1.02); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .tile-icon { font-size: 2rem; margin-bottom: 8px; }
    .tile-title { font-size: 0.95rem; color: #00e5fa; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .tile-metrics { display: flex; gap: 16px; flex-wrap: wrap; }
    .tile-metric { font-size: 1.6rem; font-weight: 700; color: #e2e8f0; line-height: 1; }
    .tile-metric-label { font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-top: 2px; }
    .tile-badge { position: absolute; top: 12px; right: 12px; background: #ef4444; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; }

    /* Detail view */
    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; color: #00e5fa; background: none; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; padding: 0; }
    .back-btn:hover { text-decoration: underline; }
    .detail-title { font-size: 1.3rem; color: #00e5fa; font-weight: 700; margin-bottom: 16px; }
    .detail-card { background: #111827; border: 1px solid rgba(0,229,250,0.1); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .detail-card h3 { font-size: 0.9rem; color: #00e5fa; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Tab bar */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab-bar button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .tab-bar button.active { background: #111827; color: #00e5fa; border-bottom-color: #111827; }

    /* Pipeline calendar card */
    .pipeline-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 14px; }
    .pipeline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

    /* Severity filter */
    .severity-filter { display: flex; gap: 6px; margin-bottom: 10px; }
    .severity-filter button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 0.75rem; }
    .severity-filter button.active { background: rgba(0,229,250,0.15); color: #00e5fa; border-color: rgba(0,229,250,0.3); }

    /* Status banner */
    .status-banner { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; margin-bottom: 16px; text-align: center; }
    .status-green { background: rgba(22,163,74,0.15); color: #22c55e; border: 1px solid rgba(22,163,74,0.3); }
    .status-yellow { background: rgba(234,179,8,0.15); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
    .status-red { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

    /* Coming soon overlay */
    .coming-soon { display: flex; align-items: center; justify-content: center; min-height: 300px; color: rgba(255,255,255,0.3); font-size: 1.2rem; font-weight: 600; }

    .diff-add { background: #e6ffec; color: #1a1a1a; }
    .diff-remove { background: #ffebe9; color: #1a1a1a; }
    .diff-block { font-family: monospace; font-size: 13px; white-space: pre-wrap; border: 1px solid #d0d7de; border-radius: 6px; overflow-x: auto; padding: 12px; max-height: 400px; }
    .kanban { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    @media (max-width: 768px) { .kanban { grid-template-columns: 1fr; } }
    .kanban-col { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 8px; min-height: 100px; }
    .kanban-col h4 { font-size: 0.7rem; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-bottom: 8px; }
    .kanban-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 8px; margin-bottom: 6px; font-size: 0.78rem; }
    .health-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .health-fill { height: 100%; border-radius: 3px; }
    .svc-urgent { border-left: 3px solid #ef4444; }
    .svc-evaluate { border-left: 3px solid #eab308; }
    .issue-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .issue-tabs button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .issue-tabs button.active { background: rgba(0,229,250,0.15); color: #00e5fa; }
    .approval-banner { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .approval-banner h3 { color: #ef4444; margin: 0 0 12px 0; font-size: 0.95rem; }
    .approval-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 14px; margin-bottom: 10px; }
    .approval-card:last-child { margin-bottom: 0; }
    .approval-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn-green { background: #22c55e; color: #0a1628; font-weight: 600; }
    .btn-green:hover { background: #16a34a; }
    .btn-orange { background: #f59e0b; color: #0a1628; font-weight: 600; }
    .btn-orange:hover { background: #d97706; }
    .btn-purple { background: #a855f7; color: white; }
    .btn-purple:hover { background: #9333ea; }
    .chat-panel { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 12px; margin-top: 12px; max-height: 400px; overflow-y: auto; }
    .chat-msg { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .chat-msg:last-child { border-bottom: none; }
    .chat-msg .author { font-weight: 600; font-size: 0.82rem; }
    .chat-msg .author.agent { color: #a855f7; }
    .chat-msg .author.human { color: #00e5fa; }
    .chat-msg .author.system { color: rgba(255,255,255,0.4); }
    .chat-msg .time { font-size: 0.7rem; color: rgba(255,255,255,0.3); }
    .chat-msg .body { font-size: 0.82rem; margin-top: 3px; }
    .timeline-step { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; }
    .timeline-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .timeline-dot.active { background: #00e5fa; }
    .timeline-dot.done { background: #22c55e; }
    .timeline-dot.pending { background: rgba(255,255,255,0.2); }
    .diff-header { background: rgba(0,229,250,0.08); padding: 4px 8px; font-size: 0.75rem; color: #00e5fa; border-bottom: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen" style="display:none;">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0e17;">
      <div style="background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 48px 40px; max-width: 420px; width: 100%;">
        <div style="text-align: center; margin-bottom: 32px;">
          <div style="font-size: 32px; margin-bottom: 12px;">&#9889;</div>
          <h1 style="margin: 0; color: #00e5fa; font-size: 20px; font-weight: 700; letter-spacing: 0.5px;">Command Center</h1>
          <p style="margin: 8px 0 0; color: #6b7280; font-size: 13px;">Mission Meets Tech Operations</p>
        </div>
        <div id="login-form">
          <label style="display: block; margin-bottom: 6px; color: #9ca3af; font-size: 13px; font-weight: 500;">Email</label>
          <input type="email" id="login-email" placeholder="you@company.com"
            style="width: 100%; padding: 10px 14px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #f9fafb; font-size: 14px; outline: none; box-sizing: border-box;"
            onfocus="this.style.borderColor='#00e5fa'" onblur="this.style.borderColor='#374151'">
          <button id="login-btn" onclick="requestLogin()"
            style="width: 100%; margin-top: 16px; padding: 12px; background: #00e5fa; color: #0a0e17; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
            Send Login Link
          </button>
          <div id="login-message" style="margin-top: 16px; text-align: center; font-size: 13px; color: #6b7280; display: none;"></div>
        </div>
        <div id="login-sent" style="display: none; text-align: center;">
          <div style="font-size: 32px; margin-bottom: 12px;">&#128231;</div>
          <p style="color: #f9fafb; font-size: 15px; margin: 0 0 8px;">Check your email</p>
          <p style="color: #6b7280; font-size: 13px; margin: 0 0 20px; line-height: 1.5;">
            We sent a login link to <strong id="sent-email" style="color: #00e5fa;"></strong>.<br>
            It expires in 15 minutes.
          </p>
          <button onclick="showLoginForm()" style="background: transparent; border: 1px solid #374151; color: #9ca3af; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;">
            Try a different email
          </button>
        </div>
        <div id="login-error" style="display: none; text-align: center;">
          <div style="font-size: 32px; margin-bottom: 12px;">&#9888;&#65039;</div>
          <p style="color: #f87171; font-size: 15px; margin: 0 0 8px;" id="login-error-text">Link expired</p>
          <button onclick="showLoginForm()" style="background: #00e5fa; color: #0a0e17; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
            Request New Link
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- USER MANAGEMENT MODAL -->
  <div id="user-mgmt-modal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 32px; max-width: 600px; width: 90%;">
      <h2 style="color: #f9fafb; margin: 0 0 24px; font-size: 18px;">Manage Users</h2>
      <div id="user-list" style="margin-bottom: 24px;"></div>
      <div style="border-top: 1px solid #1f2937; padding-top: 20px;">
        <h3 style="color: #9ca3af; font-size: 14px; margin: 0 0 12px;">Add User</h3>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <input id="new-user-email" placeholder="email@company.com" style="flex: 1; min-width: 160px; padding: 8px 12px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #f9fafb; font-size: 13px; box-sizing: border-box;">
          <input id="new-user-name" placeholder="Name" style="width: 150px; padding: 8px 12px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #f9fafb; font-size: 13px; box-sizing: border-box;">
          <select id="new-user-role" style="padding: 8px 12px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #f9fafb; font-size: 13px;">
            <option value="admin">Admin</option>
            <option value="cto">CTO</option>
            <option value="coo">COO</option>
            <option value="editor">Editor</option>
            <option value="viewer">Viewer</option>
          </select>
          <button onclick="addUser()" style="padding: 8px 16px; background: #00e5fa; color: #0a0e17; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;">Add</button>
        </div>
      </div>
      <button onclick="closeUserMgmt()" style="margin-top: 20px; width: 100%; padding: 10px; background: transparent; border: 1px solid #374151; color: #9ca3af; border-radius: 6px; cursor: pointer;">Close</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="dashboard" class="dashboard">
    <!-- USER BAR -->
    <div id="user-bar" style="display: none; padding: 8px 0; margin-bottom: 8px; border-bottom: 1px solid #1f2937; justify-content: space-between; align-items: center;">
      <div style="color: #6b7280; font-size: 13px;">
        Logged in as <span id="user-name" style="color: #f9fafb; font-weight: 600;"></span>
        <span id="user-role-badge" style="margin-left: 8px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase;"></span>
      </div>
      <div>
        <button onclick="showUserManagement()" style="background: transparent; border: 1px solid #374151; color: #9ca3af; padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-right: 8px;">
          Manage Users
        </button>
        <button onclick="logout()" style="background: transparent; border: 1px solid #374151; color: #9ca3af; padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;">
          Log Out
        </button>
      </div>
    </div>

    <header>
      <h1>MMT Command Center</h1>
      <div>
        <span id="mode-badge" class="mode mode-normal">NORMAL</span>
        <span class="refresh-info" id="last-refresh"></span>
      </div>
    </header>

    <div id="alert-banner" style="display:none;background:#ef4444;color:#fff;padding:12px 24px;font-weight:600;font-size:14px;text-align:center;border-radius:6px;margin-bottom:16px;"></div>

    <!-- Org Filter -->
    <div class="org-filter" id="org-filter">
      <button class="active" data-org="all">All</button>
      <button data-org="mmt">missionmeetstech.com</button>
      <button data-org="mp">missionpulse.ai</button>
    </div>

    <!-- Approval notification bar -->
    <div id="approval-notification-bar" style="display:none;background:rgba(0,229,250,0.08);border:1px solid rgba(0,229,250,0.2);border-radius:8px;padding:12px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:0.9rem;">
      <span id="approval-bar-text" style="color:#00e5fa;font-weight:600;"></span>
      <button class="btn btn-cyan btn-sm" onclick="scrollToConsole()" id="approval-bar-btn">Review Now</button>
    </div>

    <!-- Role selector -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.4);text-transform:uppercase;">View as:</span>
      <select id="role-selector" onchange="applyRoleFilter(this.value)" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e2e8f0;padding:4px 10px;border-radius:4px;font-size:0.8rem;">
        <option value="all">All Roles</option>
        <option value="cto">CTO</option>
        <option value="coo">COO</option>
        <option value="editor">Editor</option>
      </select>
    </div>

    <div id="loading">Loading dashboard data...</div>

    <div id="content" style="display:none;">
      <!-- TILE HOME VIEW -->
      <div id="tile-home">
        <div class="tile-grid" id="tile-grid"></div>
      </div>

      <!-- MissionPulse placeholder -->
      <div id="mp-placeholder" style="display:none;">
        <button class="back-btn" onclick="showHome()">&#8592; Back</button>
        <div class="coming-soon">MissionPulse.ai dashboard coming soon</div>
      </div>

      <!-- DETAIL VIEWS -->
      <div id="detail-newsletter" class="detail-view"></div>
      <div id="detail-products" class="detail-view"></div>
      <div id="detail-engineering" class="detail-view"></div>
      <div id="detail-business" class="detail-view"></div>
      <div id="detail-health" class="detail-view"></div>
      <div id="detail-agents" class="detail-view"></div>
      <div id="detail-content" class="detail-view"></div>
      <div id="detail-roadmap" class="detail-view"></div>
      <div id="detail-costs" class="detail-view"></div>
      <div id="detail-finance" class="detail-view"></div>
      <div id="detail-billing" class="detail-view"></div>
      <div id="detail-services" class="detail-view"></div>
      <div id="detail-customers" class="detail-view"></div>
      <div id="detail-projects" class="detail-view"></div>
      <div id="detail-qa" class="detail-view"></div>
      <div id="detail-issues" class="detail-view"></div>
      <div id="detail-coo" class="detail-view"></div>
      <div id="detail-editorial" class="detail-view"></div>
      <div id="detail-competitive" class="detail-view"></div>
      <div id="detail-learnings" class="detail-view"></div>
    </div>
  </div>

  <script>
    // Auth: session token or legacy ?key= param
    let apiKey = localStorage.getItem('mmt_session_token');
    const _urlParams = new URLSearchParams(window.location.search);
    const _legacyKey = _urlParams.get('key');
    if (_legacyKey) { apiKey = _legacyKey; }

    // Auth init runs after all functions are defined (see bottom of script)

    let dashData = {};
    let allOpsEvents = [];
    let allAgents = [];
    let selectedAgent = null;
    let currentFilter = 'all';
    let _lastResearch = null;
    let _costData = null;
    let _financeData = null;
    let _billingData = null;
    let _servicesData = null;
    let _customerData = null;
    let _projectData = null;
    let _qaData = null;
    let _issueData = null;
    let _approvalBadges = null;
    let _approvalData = {};
    let _roleFilter = 'all';

    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
    function timeSince(d) { const m = Math.floor((Date.now() - new Date(d).getTime()) / 60000); if (m < 60) return m + 'm ago'; const h = Math.floor(m / 60); if (h < 24) return h + 'h ago'; return Math.floor(h/24) + 'd ago'; }
    function fmtDate(d) { return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
    function esc(s) { return (s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
    async function apiPost(body) { return fetch('/.netlify/functions/command-center-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()); }

    async function loadDashboard() {
      try {
        const res = await fetch('/.netlify/functions/command-center-api?key=' + apiKey);
        if (!res.ok) { if (res.status === 401) { logout(); } throw new Error('API ' + res.status); }
        const data = await res.json();
        dashData = data;
        allOpsEvents = data.ops_events_24h || [];
        allAgents = data.agents || [];
        // Fetch cost data in parallel (non-blocking)
        fetch('/.netlify/functions/cost-api?key=' + apiKey + '&view=summary').then(r => r.ok ? r.json() : null).then(c => { if (c) { _costData = c; renderTiles(dashData); } }).catch(() => {});
        fetch('/.netlify/functions/billing-api?key=' + apiKey + '&view=summary').then(r => r.ok ? r.json() : null).then(b => { if (b) { _billingData = b; renderTiles(dashData); } }).catch(() => {});
        Promise.all([
          fetch('/.netlify/functions/finance-api?key=' + apiKey + '&view=services-summary').then(r => r.ok ? r.json() : null),
          fetch('/.netlify/functions/customer-api?key=' + apiKey + '&view=summary').then(r => r.ok ? r.json() : null),
          fetch('/.netlify/functions/projects-api?key=' + apiKey + '&view=dashboard').then(r => r.ok ? r.json() : null),
          fetch('/.netlify/functions/qa-api?key=' + apiKey + '&view=summary').then(r => r.ok ? r.json() : null),
          fetch('/.netlify/functions/issues-api?key=' + apiKey + '&view=stats').then(r => r.ok ? r.json() : null),
          fetch('/.netlify/functions/approval-api?key=' + apiKey + '&view=badge-counts').then(r => r.ok ? r.json() : null),
        ]).then(([svc, cust, proj, qa, iss, badges]) => {
          _servicesData = svc; _customerData = cust; _projectData = proj; _qaData = qa; _issueData = iss;
          _approvalBadges = badges;
          renderTiles(dashData);
          renderApprovalBar(badges);
        }).catch(() => {});
        renderMode(data);
        renderAlerts(data);
        renderTiles(data);
        // Re-render active detail view if one is open
        const activeDetail = document.querySelector('.detail-view.active');
        if (activeDetail) {
          const view = activeDetail.id.replace('detail-', '');
          renderDetailView(view);
        }
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) { console.error('Load failed:', e); document.getElementById('loading').textContent = 'Failed: ' + e.message; }
    }

    function renderMode(data) {
      const mode = data.health?.mode || 'normal';
      const badge = document.getElementById('mode-badge');
      badge.textContent = mode.toUpperCase();
      badge.className = 'mode mode-' + mode;
    }

    function renderAlerts(data) {
      const banner = document.getElementById('alert-banner');
      const alerts = [];
      const pp = data.orders_24h?.proposalpulse || [];
      const mp = data.orders_24h?.marketpulse || [];
      const tenMinAgo = Date.now() - 600000;
      pp.forEach(o => { const t = ['delivered','email_sent','email_failed','failed','error','quality_fail','ERROR']; if (!t.includes(o.workflow_state) && !t.includes(o.verdict) && new Date(o.created_at).getTime() < tenMinAgo) alerts.push('PP stuck: ' + (o.id||'').slice(0,8)); });
      mp.forEach(o => { const t = ['delivered','email_sent','failed','error','quality_fail']; if (!t.includes(o.workflow_state) && new Date(o.created_at).getTime() < tenMinAgo) alerts.push('MP stuck: ' + (o.session_id||o.id||'').slice(0,8)); });
      const crit = (data.ops_events_24h||[]).filter(e => e.severity === 'critical' && !e.resolution);
      if (crit.length > 0) alerts.push(crit.length + ' unresolved critical event' + (crit.length>1?'s':''));
      if (alerts.length > 0) { banner.style.display = 'block'; banner.textContent = alerts.join(' | '); }
      else { banner.style.display = 'none'; }
    }

    // ============ TILE METRICS COMPUTATION ============

    function getTileData(data) {
      const pp = data.orders_24h?.proposalpulse || [];
      const mp = data.orders_24h?.marketpulse || [];
      const allOrders = [...pp, ...mp];
      const activeOrders = allOrders.filter(o => !['delivered','email_sent','email_failed','ERROR','error','quality_fail'].includes(o.workflow_state) && !['delivered','email_sent','email_failed','ERROR'].includes(o.verdict));
      const deliveredToday = allOrders.filter(o => ['delivered','email_sent'].includes(o.workflow_state) || ['delivered','email_sent'].includes(o.verdict));
      const errorOrders = allOrders.filter(o => ['ERROR','error','quality_fail','email_failed'].includes(o.workflow_state) || o.verdict === 'ERROR');

      const pipeline = data.pipeline || [];
      const now = new Date();
      const threeDaysMs = 3 * 24 * 60 * 60 * 1000;
      const nearPipeline = pipeline.filter(p => p.status === 'planning' && new Date(p.publish_date) - now < threeDaysMs && new Date(p.publish_date) > now);
      const nextIssue = pipeline.filter(p => new Date(p.publish_date) >= now).sort((a,b) => new Date(a.publish_date) - new Date(b.publish_date))[0];
      const daysToPublish = nextIssue ? Math.ceil((new Date(nextIssue.publish_date) - now) / 86400000) : null;
      const nextStatus = nextIssue ? nextIssue.status : null;

      const tasks = data.tasks || [];
      const pendingTasks = tasks.filter(t => t.status === 'pending' || t.status === 'in_progress');

      const events = data.ops_events_24h || [];
      const errorEvents = events.filter(e => e.severity === 'critical' || e.severity === 'error');
      const critEvents = events.filter(e => e.severity === 'critical' && !e.resolution);

      const agents = data.agents || [];
      const onlineAgents = agents.filter(a => a.status === 'active' || a.status === 'busy');
      const thirtyMinAgo = Date.now() - 1800000;
      const staleAgents = agents.filter(a => a.last_active && new Date(a.last_active).getTime() < thirtyMinAgo && (a.status === 'active' || a.status === 'busy'));

      const images = data.recent_images || [];
      const signals = data.signals || [];

      const rev = data.revenue;
      const revTotal = rev && !rev.error ? (rev.total_revenue_cents / 100) : null;

      const highDebt = ROADMAP.techDebt.filter(d => d.severity === 'HIGH').length;
      const cooBadge = _approvalBadges ? _approvalBadges.coo : 0;
      const editorBadge = _approvalBadges ? _approvalBadges.editor : 0;
      return [
        { id: 'coo', icon: '🎯', title: 'COO Console', m1: cooBadge || '--', m1l: 'Pending', m2: _servicesData ? '$' + (_servicesData.totalMonthlyCents / 100).toFixed(0) : '--', m2l: 'Mo. Burn', badge: cooBadge, roles: ['coo', 'all'] },
        { id: 'editorial', icon: '✏️', title: 'Editorial', m1: editorBadge || '--', m1l: 'Drafts', m2: null, m2l: null, badge: editorBadge, roles: ['editor', 'all'] },
        { id: 'roadmap', icon: '\ud83d\udccb', title: 'Roadmap', m1: '2', m1l: 'Platforms', m2: highDebt, m2l: 'High debt', badge: highDebt },
        { id: 'costs', icon: '\ud83d\udcb0', title: 'Cost Intelligence', m1: _costData ? '$' + (_costData.today.totalCents / 100).toFixed(2) : '--', m1l: 'Today', m2: _costData ? _costData.today.calls : '--', m2l: 'API Calls', badge: _costData ? _costData.alerts.filter(a => a.severity === 'critical').length : 0 },
        { id: 'finance', icon: '💰', title: 'Cost Intelligence', m1: _costData ? '$' + (_costData.today.totalCents / 100).toFixed(2) : '--', m1l: 'Today', m2: _costData ? _costData.today.calls : '--', m2l: 'API Calls', badge: _costData ? _costData.alerts.filter(a => a.severity === 'critical').length : 0 },
        { id: 'billing', icon: '🧾', title: 'Billing Tracker', m1: _billingData ? '$' + ((_billingData.summary?.total_cents || 0) / 100).toFixed(0) : '--', m1l: 'This month', m2: _billingData ? (_billingData.needsReview?.length || 0) : '--', m2l: 'Needs review', badge: _billingData ? (_billingData.needsReview?.length || 0) : 0 },
        { id: 'services', icon: '💳', title: 'Services', m1: _servicesData ? '$' + (_servicesData.totalMonthlyCents / 100).toFixed(0) : '--', m1l: 'Monthly burn', m2: _servicesData ? _servicesData.pendingDecisions : '--', m2l: 'Decisions', badge: _servicesData ? _servicesData.upcomingDeadlines?.length || 0 : 0 },
        { id: 'customers', icon: '👥', title: 'Customers', m1: _customerData ? _customerData.total : '--', m1l: 'Total', m2: _customerData ? _customerData.avgHealth : '--', m2l: 'Avg Health', badge: _customerData ? _customerData.atRisk : 0 },
        { id: 'projects', icon: '📋', title: 'Projects', m1: _projectData ? _projectData.openTasks : '--', m1l: 'Open tasks', m2: _projectData ? _projectData.blockedTasks : '--', m2l: 'Blocked', badge: _projectData ? _projectData.blockedTasks : 0 },
        { id: 'qa', icon: '🧪', title: 'QA', m1: _qaData ? _qaData.totalRegressions : '--', m1l: 'Regressions', m2: '--', m2l: 'Pass rate', badge: _qaData ? _qaData.totalRegressions : 0 },
        { id: 'issues', icon: '🔧', title: 'Issues', m1: _issueData ? _issueData.total : '--', m1l: 'Open', m2: _issueData ? (_issueData.byStatus?.['fix-proposed'] || 0) : '--', m2l: 'Awaiting approval', badge: _issueData ? (_issueData.critical + (_issueData.byStatus?.['fix-proposed'] || 0)) : 0 },
        { id: 'newsletter', icon: '\ud83d\udcf0', title: 'Newsletter', m1: daysToPublish !== null ? daysToPublish : '--', m1l: 'Days to pub', m2: nextStatus || '--', m2l: 'Status', badge: nearPipeline.length || 0 },
        { id: 'products', icon: '\ud83d\udce6', title: 'Products', m1: activeOrders.length, m1l: 'Active orders', m2: deliveredToday.length, m2l: 'Delivered', badge: errorOrders.length },
        { id: 'engineering', icon: '\ud83d\udd27', title: 'Engineering', m1: pendingTasks.length, m1l: 'Pending tasks', m2: null, m2l: null, badge: pendingTasks.length },
        { id: 'business', icon: '\ud83d\udcca', title: 'Business', m1: revTotal !== null ? '$' + revTotal.toLocaleString() : '--', m1l: rev?.month || 'Revenue', m2: null, m2l: null, badge: 0 },
        { id: 'health', icon: '\ud83d\udee1\ufe0f', title: 'Site Health', m1: errorEvents.length, m1l: 'Errors (24h)', m2: null, m2l: null, badge: critEvents.length },
        { id: 'agents', icon: '\ud83e\udd16', title: 'Agent Fleet', m1: onlineAgents.length + '/' + agents.length, m1l: 'Online', m2: null, m2l: null, badge: staleAgents.length },
        { id: 'content', icon: '\ud83c\udfa8', title: 'Content Studio', m1: images.length, m1l: 'Images', m2: signals.length, m2l: 'Signals', badge: 0 },
        { id: 'competitive', icon: '\ud83c\udfaf', title: 'Competitive Intel', m1: '--', m1l: 'Competitors', m2: '--', m2l: 'Unreviewed', badge: 0 },
        { id: 'learnings', icon: '\ud83e\udde0', title: 'Agent Memory', m1: '--', m1l: 'Active rules', m2: '--', m2l: 'Applied', badge: 0 }
      ];
    }

    function renderTiles(data) {
      const tiles = getTileData(data);
      const grid = document.getElementById('tile-grid');
      grid.innerHTML = tiles.map(t => {
        const badgeHtml = t.badge > 0 ? '<div class="tile-badge">' + t.badge + '</div>' : '';
        let metricsHtml = '<div class="tile-metrics"><div><div class="tile-metric">' + t.m1 + '</div><div class="tile-metric-label">' + t.m1l + '</div></div>';
        if (t.m2 !== null) metricsHtml += '<div><div class="tile-metric" style="font-size:1.1rem;">' + t.m2 + '</div><div class="tile-metric-label">' + (t.m2l||'') + '</div></div>';

        return '<div class="tile" onclick="navigate(\'' + t.id + '\')">' + badgeHtml + '<div class="tile-icon">' + t.icon + '</div><div class="tile-title">' + t.title + '</div>' + metricsHtml + '</div>';

    // ============ NAVIGATION ============

    function navigate(view) {
      window.location.hash = view;
    }

    function showHome() {
      window.location.hash = '';
    }

    function applyRoute() {
      const hash = window.location.hash.replace('#', '');
      const home = document.getElementById('tile-home');
      const placeholder = document.getElementById('mp-placeholder');
      document.querySelectorAll('.detail-view').forEach(d => d.classList.remove('active'));
      placeholder.style.display = 'none';

      if (!hash) {
        home.style.display = 'block';
        return;
      }
      home.style.display = 'none';
      const detail = document.getElementById('detail-' + hash);
      if (detail) {
        detail.classList.add('active');
        renderDetailView(hash);
      }
    }

      const statuses = ['planning','researching','drafting','editing','ready','published','killed'];

      // Section 2: Spend by provider (horizontal bars)
      h += '<div class="detail-card"><h3>Spend by Provider</h3>';
      const providerTotal = Object.values(c.byProvider).reduce((s, v) => s + v, 0) || 1;

      const sortedProviders = Object.entries(c.byProvider).sort((a, b) => b[1] - a[1]);
      for (const [prov, cents] of sortedProviders) {

        const color = provColors[prov] || '#9ca3af';
        h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
        h += '<span style="width:80px;font-size:0.78rem;color:rgba(255,255,255,0.6);text-transform:capitalize;">' + prov + '</span>';
        h += '<div style="flex:1;background:rgba(255,255,255,0.05);border-radius:3px;height:16px;overflow:hidden;"><div style="background:' + color + ';width:' + pct + '%;height:100%;border-radius:3px;transition:width 0.3s;"></div></div>';
        h += '<span style="width:70px;text-align:right;font-size:0.78rem;color:rgba(255,255,255,0.5);">$' + dollars + ' (' + pct + '%)</span>';
        h += '</div>';
      }
      h += '</div>';

      // Section 3: Spend by product
      h += '<div class="detail-card"><h3>Spend by Product</h3>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">';
      for (const [prod, cents] of Object.entries(c.byProduct).sort((a, b) => b[1] - a[1])) {
        h += '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px;">';
        h += '<div style="font-size:0.82rem;font-weight:600;color:#e2e8f0;text-transform:capitalize;">' + prod.replace(/-/g, ' ') + '</div>';
        h += '<div style="font-size:1.4rem;font-weight:700;color:#22c55e;margin:4px 0;">$' + (cents / 100).toFixed(2) + '</div>';
        h += '</div>';
      }
      h += '</div></div>';

      // Section 4: 7-day trend
      if (c.trend && Object.keys(c.trend).length > 0) {
        h += '<div class="detail-card"><h3>7-Day Trend</h3>';
        const trendDays = Object.entries(c.trend).sort((a, b) => a[0].localeCompare(b[0])).slice(-7);
        const maxCents = Math.max(...trendDays.map(d => d[1]), 1);
        h += '<div style="display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px;">';
        for (const [date, cents] of trendDays) {
          const pct = Math.round(cents / maxCents * 100);
          const day = new Date(date + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short' });
          h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">';
          h += '<span style="font-size:0.65rem;color:rgba(255,255,255,0.4);">$' + (cents / 100).toFixed(2) + '</span>';
          h += '<div style="width:100%;background:rgba(0,229,250,0.3);border-radius:3px 3px 0 0;height:' + Math.max(pct, 4) + '%;"></div>';
          h += '<span style="font-size:0.65rem;color:rgba(255,255,255,0.3);">' + day + '</span>';
          h += '</div>';
        }
        h += '</div></div>';
      }

      // Section 5: Alerts
      if (c.alerts && c.alerts.length > 0) {
        h += '<div class="detail-card"><h3>Unresolved Alerts (' + c.alerts.length + ')</h3>';
        for (const a of c.alerts) {
          const sColor = a.severity === 'critical' ? '#ef4444' : a.severity === 'warn' ? '#eab308' : '#60a5fa';

          h += '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:600;color:#e2e8f0;">' + esc(a.title) + '</span><span class="badge badge-' + (a.severity === 'critical' ? 'red' : a.severity === 'warn' ? 'yellow' : 'blue') + '">' + a.severity + '</span></div>';
          h += '<div style="font-size:0.78rem;color:rgba(255,255,255,0.4);margin-top:4px;">' + timeSince(a.created_at) + '</div>';
          h += '<div style="margin-top:8px;"><button class="btn btn-sm btn-cyan" onclick="resolveCostAlert(\'' + a.id + '\',\'approved\')">Approve</button> <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:#e2e8f0;" onclick="resolveCostAlert(\'' + a.id + '\',\'dismissed\')">Dismiss</button></div>';
          h += '</div>';
        }
        h += '</div>';
      } else {
        h += '<div class="detail-card"><h3>Alerts</h3><p style="color:rgba(255,255,255,0.3);font-size:0.82rem;">No unresolved alerts.</p></div>';
      }

      h += '<div style="text-align:center;font-size:0.7rem;color:rgba(255,255,255,0.2);margin-top:8px;">Data refreshes every 30 seconds</div>';
      el.innerHTML = h;
    }

    async function runResearch() {
      const query = document.getElementById('research-query').value.trim();
      if (!query) return;
      const providers = [];
      if (document.getElementById('research-perplexity').checked) providers.push('perplexity');
      if (document.getElementById('research-chatgpt').checked) providers.push('chatgpt');
      if (document.getElementById('research-gemini').checked) providers.push('gemini');
      providers.forEach(p => { const el = document.getElementById('result-' + p); if (el) el.querySelector('.r-content').innerHTML = '<span style="color:#eab308;">Researching...</span>'; });
      try {
        const resp = await fetch('/.netlify/functions/ai-research?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, providers }) });
        const data = await resp.json();
        for (const [prov, result] of Object.entries(data.results)) {
          const el = document.getElementById('result-' + prov);
          if (!el) continue;
          const contentEl = el.querySelector('.r-content');
          if (result.error) {
            contentEl.innerHTML = '<span style="color:#ef4444;">' + esc(result.error) + '</span>';
          } else {
            const html = esc(result.answer).replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
            contentEl.innerHTML = '<div style="font-size:0.8rem;line-height:1.5;color:#e2e8f0;max-height:300px;overflow-y:auto;">' + html + '</div>' + (result.citations && result.citations.length ? '<div style="margin-top:6px;font-size:0.7rem;color:rgba(255,255,255,0.3);">' + result.citations.length + ' sources</div>' : '');
          }
        }
        document.getElementById('research-actions').style.display = 'flex';
        _lastResearch = data;
      } catch (e) {
        providers.forEach(p => { const el = document.getElementById('result-' + p); if (el) el.querySelector('.r-content').innerHTML = '<span style="color:#ef4444;">' + esc(e.message) + '</span>'; });
      }
    }

      const combined = Object.entries(_lastResearch.results).filter(([k, v]) => v.answer).map(([k, v]) => '[' + k + ']: ' + v.answer).join('\n\n---\n\n');

  Object.entries(providers).sort((a,b) => b[1]-a[1]).forEach(([p, cents]) => {

  });
  h += '</div>';

  // 7-day trend sparkline
  const trend = _costData.trend || {};
  const trendDays = Object.entries(trend).sort((a,b) => a[0].localeCompare(b[0])).slice(-7);
  if (trendDays.length > 1) {
    h += '<div class="detail-card"><h3>7-Day Trend</h3>';
    const maxVal = Math.max(...trendDays.map(d => d[1]), 1);
    h += '<div style="display:flex;align-items:end;gap:4px;height:60px;">';
    trendDays.forEach(([date, cents]) => {
      const pct = (cents / maxVal * 100);
      h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;"><div style="width:100%;height:' + pct + '%;min-height:2px;background:linear-gradient(180deg,#00e5fa,#00ff85);border-radius:2px;"></div><div style="font-size:0.6rem;color:rgba(255,255,255,0.3);margin-top:4px;">' + date.slice(5) + '</div></div>';
    });
    h += '</div></div>';
  }

  // Alerts
  const alerts = _costData.alerts || [];
  if (alerts.length > 0) {
    h += '<div class="detail-card"><h3>Active Alerts</h3>';
    alerts.forEach(a => {
      const sc = a.severity === 'critical' ? 'red' : 'yellow';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><div><span class="badge badge-' + sc + '">' + a.severity + '</span> <span style="font-size:0.82rem;">' + esc(a.title) + '</span></div><button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);" onclick="resolveFinanceAlert(\'' + a.id + '\')">Resolve</button></div>';
    });
    h += '</div>';
  }

  // Rate card (collapsible)
  try {
    const rateRes = await fetch('/.netlify/functions/finance-api?key=' + apiKey + '&view=rate-card');
    const rateData = await rateRes.json();
    if (rateData.rateCard?.length) {
      h += '<div class="detail-card"><h3 style="cursor:pointer;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'">Rate Card ▸</h3><div style="display:none;">';
      h += '<table><tr><th>Provider</th><th>Model</th><th>Input/1K</th><th>Output/1K</th><th>Per Call</th></tr>';
      rateData.rateCard.forEach(r => {
        h += '<tr><td>' + esc(r.provider) + '</td><td style="font-size:0.75rem">' + esc(r.model) + '</td><td>' + (r.input_cost_per_1k_cents || '--') + '¢</td><td>' + (r.output_cost_per_1k_cents || '--') + '¢</td><td>' + (r.per_call_cost_cents || '--') + '¢</td></tr>';
      });
      h += '</table></div></div>';
    }
  } catch {}

  el.innerHTML = h;
}

async function reviewBillingRecord(id, approved) {
  await fetch('/.netlify/functions/billing-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'review_record', record_id: id, approved }) });
  toast(approved ? 'Record approved' : 'Record rejected');
  renderDetailBilling();
}

async function triggerBillingSync() {
  toast('Triggering billing sync...');
  const res = await fetch('/.netlify/functions/billing-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'trigger_sync' }) });
  const data = await res.json();
  toast(data.error ? 'Sync failed: ' + data.error : 'Sync triggered');
  setTimeout(() => renderDetailBilling(), 3000);
}

async function toggleBillingSource(source, enabled) {
  await fetch('/.netlify/functions/billing-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'toggle_source', source, enabled }) });
  toast(source + ' ' + (enabled ? 'enabled' : 'disabled'));
  renderDetailBilling();
}

async function addManualBilling() {
  const service = document.getElementById('manual-service').value;
  const date = document.getElementById('manual-date').value;
  const amount = parseFloat(document.getElementById('manual-amount').value);
  const category = document.getElementById('manual-category').value;
  if (!service || !date || !amount) { toast('Fill all fields'); return; }
  await fetch('/.netlify/functions/billing-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'add_manual', service_name: service, charge_date: date, amount_cents: Math.round(amount * 100), category, is_business: true }) });
  toast('Entry added');
  renderDetailBilling();
}

async function importAppleCSV() {
  const csv = document.getElementById('apple-csv').value;
  if (!csv.trim()) { toast('Paste CSV data first'); return; }
  const res = await fetch('/.netlify/functions/billing-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'import_apple', csv }) });
  const data = await res.json();
  toast('Imported ' + (data.imported || 0) + ' of ' + (data.total || 0) + ' records');
  renderDetailBilling();
}

async function exportBillingCSV(taxOnly) {
  const month = new Date().toISOString().slice(0, 7);
  const res = await fetch('/.netlify/functions/billing-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'export_csv', month, tax_only: taxOnly }) });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'billing-' + month + (taxOnly ? '-tax' : '') + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

let issuesTab = 'needs-attention';
let _chatPollInterval = null;
let _openIssueId = null;

function renderDiffBlock(diffText) {
  if (!diffText) return '';
  let h = '<div class="diff-block">';
  diffText.split('\n').forEach(line => {
    if (line.startsWith('@@')) h += '<div class="diff-header">' + esc(line) + '</div>';
    else if (line.startsWith('+')) h += '<div class="diff-add">' + esc(line) + '</div>';
    else if (line.startsWith('-')) h += '<div class="diff-remove">' + esc(line) + '</div>';
    else h += '<div>' + esc(line) + '</div>';
  });
  h += '</div>';
  return h;
}

function renderComments(comments) {
  let h = '';
  if (!comments.length) return '<p style="color:rgba(255,255,255,0.3)">No comments yet</p>';
  comments.forEach(c => {
    const authorClass = c.author_type === 'human' ? 'human' : c.author_type === 'system' ? 'system' : 'agent';
    h += '<div class="chat-msg">';
    h += '<div style="display:flex;justify-content:space-between;"><span class="author ' + authorClass + '">' + esc(c.author) + (c.action ? ' <span class="badge badge-gray" style="font-size:0.65rem;">' + c.action + '</span>' : '') + '</span><span class="time">' + timeSince(c.created_at) + '</span></div>';
    h += '<div class="body">' + esc(c.content) + '</div>';
    if (c.code_diff) h += renderDiffBlock(c.code_diff);
    h += '</div>';
  });
  return h;
}

function renderTimeline(issue) {
  const statuses = ['detected', 'diagnosing', 'diagnosed', 'fix-proposed', 'fix-approved', 'deploying', 'deployed', 'verified', 'closed'];
  const history = issue.status_history || [];
  const currentIdx = statuses.indexOf(issue.status);
  let h = '';
  statuses.forEach((s, idx) => {
    const entry = history.find(e => e.to === s);
    const isDone = idx < currentIdx || issue.status === 'closed';
    const isCurrent = s === issue.status;
    const dotClass = isDone ? 'done' : isCurrent ? 'active' : 'pending';
    h += '<div class="timeline-step">';
    h += '<div class="timeline-dot ' + dotClass + '"></div>';
    h += '<div><div style="font-size:0.82rem;font-weight:' + (isCurrent ? '600' : '400') + ';color:' + (isCurrent ? '#00e5fa' : isDone ? '#22c55e' : 'rgba(255,255,255,0.3)') + ';">' + s + '</div>';
    if (entry) h += '<div style="font-size:0.7rem;color:rgba(255,255,255,0.3);">' + timeSince(entry.at) + (entry.by ? ' by ' + entry.by : '') + '</div>';
    h += '</div></div>';
  });
  return h;
}

    const nextStatuses = statusActions[i.status] || ['closed'];
    nextStatuses.forEach(ns => {

    h += '</div></div>';

    el.innerHTML = h;
  } catch (e) { el.innerHTML = '<p style="color:#ef4444">Failed: ' + e.message + '</p>'; }
}

// Chat polling
function startChatPoll(issueId) {
  stopChatPoll();
  _chatPollInterval = setInterval(async () => {
    try {
      const res = await fetch('/.netlify/functions/issues-api?key=' + apiKey + '&view=detail&id=' + issueId);
      const data = await res.json();
      const panel = document.getElementById('issue-chat-panel');
      if (panel) panel.innerHTML = renderComments(data.comments || []);
    } catch {}
  }, 10000);
}
function stopChatPoll() { if (_chatPollInterval) { clearInterval(_chatPollInterval); _chatPollInterval = null; } }

async function postIssueComment(issueId) {
  const input = document.getElementById('issue-comment-input');
  const content = input.value.trim();
  if (!content) return;
  await fetch('/.netlify/functions/issues-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'comment', issueId, author: 'cto', authorType: 'human', content }) });

  showIssueDetail(issueId);
}

async function askAgent(issueId) {

  await fetch('/.netlify/functions/issues-api?key=' + apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'comment', issueId, author: 'cto', authorType: 'human', content: msg, commentAction: 'diagnose' }) });

async function rejectIssueFix(id) {

  showIssueDetail(id);

            h += '<div style="font-size:0.75rem;color:rgba(255,255,255,0.4);margin-top:4px;">';
            h += '<span class="badge badge-cyan">' + esc(l.agent || '') + '</span> ';
            h += '<span>' + esc(l.category || '') + '</span> ';
            h += '<span>Confidence: ' + ((l.confidence || 0) * 100).toFixed(0) + '%</span>';
            h += '</div></div>';
          });
        }
        h += '</div>';
        var effRes = await fetch('/.netlify/functions/learning-api?view=effective', { headers: { 'Authorization': 'Bearer ' + apiKey } });
        var effData = effRes.ok ? await effRes.json() : {};
        var effective = effData.learnings || [];
        if (effective.length) {
          h += '<div class="detail-card"><h3>Most Effective Rules</h3>';
          effective.slice(0, 10).forEach(function(l) {
            h += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);">';
            h += '<div style="font-weight:600;font-size:0.85rem;">' + esc(l.rule || '') + '</div>';
            h += '<div style="font-size:0.75rem;color:rgba(255,255,255,0.4);">Applied: ' + (l.times_applied || 0) + ' | Prevented errors: ' + (l.prevented_errors || 0) + '</div>';
            h += '</div>';
          });
          h += '</div>';
        }
      } catch (e) {
        h += '<div class="detail-card"><p style="color:rgba(255,255,255,0.3);">Failed to load learning data.</p></div>';
      }
      el.innerHTML = h;
    }

    const _origLoadDashboard = loadDashboard;
    let _firstLoad = true;
    // We handle route on hashchange and after initial load via the render cycle
    // The applyRoute is called after content becomes visible
    const _observer = new MutationObserver(() => {
      if (document.getElementById('content').style.display === 'block' && _firstLoad) {
        _firstLoad = false;
        applyRoute();
        _observer.disconnect();
      }
    });
    _observer.observe(document.getElementById('content'), { attributes: true, attributeFilter: ['style'] });

    // ─── AUTH: Login / Logout / Session Management ───
    const AUTH_API = '/.netlify/functions/dashboard-auth';
    let currentUser = null;

    async function initAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const authToken = urlParams.get('auth');
      const authEmail = urlParams.get('email');

      // Magic link click — verify token
      if (authToken && authEmail) {
        try {
          const resp = await fetch(AUTH_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'verify', token: authToken, email: authEmail })
          });
          const data = await resp.json();
          if (data.authenticated) {
            localStorage.setItem('mmt_session_token', data.token);
            localStorage.setItem('mmt_user', JSON.stringify(data.user));
            apiKey = data.token;
            window.history.replaceState({}, '', window.location.pathname + (window.location.hash || ''));
            showDashboard(data.user);
            return;
          } else {
            showLoginError(data.error || 'Link expired or invalid');
            return;
          }
        } catch (e) {
          showLoginError('Connection error. Try again.');
          return;
        }
      }

      // Legacy ?key= param — validate and proceed
      if (_legacyKey) {
        apiKey = _legacyKey;
        showDashboard({ name: 'Admin', role: 'admin', email: '' });
        return;
      }

      // Stored session token — validate
      const storedToken = localStorage.getItem('mmt_session_token');
      if (storedToken) {
        try {
          const resp = await fetch(AUTH_API + '?action=validate&token=' + storedToken);
          const data = await resp.json();
          if (data.authenticated) {
            currentUser = data.user;
            apiKey = storedToken;
            localStorage.setItem('mmt_user', JSON.stringify(data.user));
            showDashboard(data.user);
            return;
          }
        } catch (e) { /* fall through */ }
        localStorage.removeItem('mmt_session_token');
        localStorage.removeItem('mmt_user');
      }

      showLogin();
    }

    function showLogin() {
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }

    function showDashboard(user) {
      currentUser = user;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      if (user && user.name) {
        document.getElementById('user-bar').style.display = 'flex';
        document.getElementById('user-name').textContent = user.name;
        var badge = document.getElementById('user-role-badge');
        var roleColors = { admin: '#f59e0b', cto: '#3b82f6', coo: '#10b981', editor: '#8b5cf6', viewer: '#6b7280' };
        badge.textContent = user.role || 'admin';
        badge.style.background = (roleColors[user.role] || '#6b7280') + '22';
        badge.style.color = roleColors[user.role] || '#6b7280';
      }

      loadDashboard();
      setInterval(loadDashboard, 30000);
    }

    async function requestLogin() {
      var email = document.getElementById('login-email').value.trim();
      if (!email) return;
      var btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        await fetch(AUTH_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'request_link', email: email })
        });
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('login-sent').style.display = 'block';
        document.getElementById('sent-email').textContent = email;
      } catch (e) {
        showLoginMessage('Connection error. Try again.', '#f87171');
      }
      btn.disabled = false;
      btn.textContent = 'Send Login Link';
    }

    function showLoginForm() {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('login-sent').style.display = 'none';
      document.getElementById('login-error').style.display = 'none';
    }

    function showLoginError(msg) {
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('login-error-text').textContent = msg;
    }

    function showLoginMessage(msg, color) {
      var el = document.getElementById('login-message');
      el.textContent = msg;
      el.style.color = color || '#6b7280';
      el.style.display = 'block';
    }

    async function logout() {
      var token = localStorage.getItem('mmt_session_token');
      if (token) {
        try {
          await fetch(AUTH_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'logout', token: token })
          });
        } catch (e) { /* best effort */ }
      }
      localStorage.removeItem('mmt_session_token');
      localStorage.removeItem('mmt_user');
      currentUser = null;
      apiKey = null;
      showLogin();
    }

    async function showUserManagement() {
      var modal = document.getElementById('user-mgmt-modal');
      modal.style.display = 'flex';
      var token = localStorage.getItem('mmt_session_token') || apiKey;
      var resp = await fetch(AUTH_API + '?action=users', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      var data = await resp.json();
      var list = document.getElementById('user-list');
      list.innerHTML = (data.users || []).map(function(u) {
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#1f2937;border-radius:6px;margin-bottom:6px;">' +
          '<div><span style="color:#f9fafb;font-weight:500;font-size:14px;">' + esc(u.name) + '</span>' +
          '<span style="color:#6b7280;font-size:12px;margin-left:8px;">' + esc(u.email) + '</span></div>' +
          '<div><span style="padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;background:#374151;color:#9ca3af;">' + esc(u.role) + '</span>' +
          (u.is_active ? '' : '<span style="margin-left:6px;color:#f87171;font-size:11px;">INACTIVE</span>') +
          (u.last_login_at ? '<span style="margin-left:8px;color:#6b7280;font-size:11px;">Last: ' + new Date(u.last_login_at).toLocaleDateString() + '</span>' : '<span style="margin-left:8px;color:#6b7280;font-size:11px;">Never logged in</span>') +
          '</div></div>';
      }).join('');
    }

    function closeUserMgmt() { document.getElementById('user-mgmt-modal').style.display = 'none'; }

    async function addUser() {
      var email = document.getElementById('new-user-email').value.trim();
      var name = document.getElementById('new-user-name').value.trim();
      var role = document.getElementById('new-user-role').value;
      if (!email || !name) { alert('Email and name required'); return; }
      var token = localStorage.getItem('mmt_session_token') || apiKey;
      var resp = await fetch(AUTH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ action: 'add_user', email: email, name: name, role: role })
      });
      var data = await resp.json();
      if (data.error) { alert(data.error); return; }
      document.getElementById('new-user-email').value = '';
      document.getElementById('new-user-name').value = '';
      showUserManagement();
    }

    // Enter key on email input
    document.getElementById('login-email').addEventListener('keydown', function(e) { if (e.key === 'Enter') requestLogin(); });

    // Start auth flow
    initAuth();
  </script>
</body>
</html>
