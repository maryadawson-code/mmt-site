[build]
  publish = "dist"
  # Newsletter sync runs before build; set BUTTONDOWN_API_KEY env var for richer data.
  # validate-dist.js fails the build if dist/ contains any public-facing
  # drift pattern from docs/site-spec.md §14a. If it exits non-zero,
  # Netlify will refuse to deploy.
  command = "node scripts/sync-newsletters.js; node scripts/sync-linkedin-newsletter.js; node build.js && node scripts/validate-dist.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "security-headers"
  path = "/*"

[functions."score-deck"]
  external_node_modules = ["file-type"]

[functions."score-deck-background"]
  external_node_modules = ["file-type"]

[functions."weekly-report"]
  schedule = "0 14 * * 1"

# Premium Friday Brief — every Friday at 6 AM ET (11:00 UTC)
# Emails the latest brief to all active premium subscribers via Resend
[functions."premium-brief-send"]
  schedule = "0 11 * * 5"

# Premium Monthly Brief — 1st of month at 6 AM ET (11:00 UTC)
# Emails the monthly intelligence brief to premium subscribers
[functions."monthly-brief-send"]
  schedule = "0 11 1 * *"

# Premium Digest — daily at 6:30 AM ET (11:30 UTC)
# Personalized notification digest based on subscriber preferences
[functions."premium-digest-send"]
  schedule = "30 11 * * *"

[functions."rebuild-trigger"]
  schedule = "0 */4 * * *"

[functions."contract-intel-refresh"]
  schedule = "0 11 * * *"

# LinkedIn newsletter sync — Tue/Fri at 6 PM ET (23:00 UTC)
# Searches for new Mission Meets Tech articles, creates markdown stubs via GitHub API, triggers rebuild
[functions."newsletter-sync"]
  schedule = "0 23 * * 2,5"

# Buttondown newsletter send — runs 30 min after newsletter-sync (Tue/Fri 11:30 PM UTC)
# Checks for new articles from the last 3 days and sends a digest to subscribers
[functions."newsletter-send"]
  schedule = "30 23 * * 2,5"

# SAM.gov opportunities can post/close within days — 4hr polling
[functions."opportunity-radar"]
  schedule = "0 */4 * * *"

[functions."sb-vehicle-radar"]
  schedule = "0 13 * * *"

[functions."score-cleanup"]
  schedule = "*/30 * * * *"

[functions."health-check"]
  schedule = "0 */6 * * *"

[functions."daily-stats-rollup"]
  schedule = "0 0 * * *"

[functions."tactical-brief-cleanup"]
  schedule = "*/30 * * * *"

# DISABLED — not needed for launch
# [functions."newsletter-research"]
#   schedule = "..."

[functions."ops-pattern-detector"]
  # DISABLED for launch — re-enable when ops monitoring is tuned
  # schedule = "0 13 * * *"

[functions."quality-drift-check-background"]
  schedule = "0 12 * * 1"

# DISABLED — not in use, wastes tokens generating low-value intel review emails
# [functions."review-queue-digest-background"]
#   schedule = "0 11 * * *"

[functions."predictive-signals-background"]
  # DISABLED for launch — re-enable when signal pipeline is validated
  # schedule = "0 10 * * 3"

[functions."ops-health-check"]
  schedule = "*/30 * * * *"

[functions."cost-rollup"]
  schedule = "0 7 * * *"

[functions."customer-health-rollup"]
  schedule = "0 12 * * *"

[functions."sentry-sync"]
  schedule = "*/30 * * * *"

[functions."finance-rollup"]
  schedule = "0 7 * * *"

[functions."backup-db"]
  schedule = "0 7 * * *"

[functions."competitive-scan"]
  schedule = "0 14 * * 1"

[functions."billing-sync"]
  schedule = "0 8 * * *"

[functions."roadmap-health-check"]
  schedule = "0 10 * * *"

# Sentry Netlify build plugin REMOVED — archived package was failing deploys
# during onPostBuild (API timeout). Runtime @sentry/node monitoring in Netlify
# Functions is unaffected. To restore release tracking later, use sentry-cli
# in a custom non-blocking post-build script.
# [[plugins]]
#   package = "@sentry/netlify-build-plugin"

