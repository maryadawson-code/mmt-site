[build]
  publish = "dist"
  # Newsletter sync runs before build; set BUTTONDOWN_API_KEY env var for richer data.
  # validate-dist.js fails the build if dist/ contains any public-facing
  # drift pattern from docs/site-spec.md §14a. If it exits non-zero,
  # Netlify will refuse to deploy.
  command = "node scripts/sync-newsletters.js; node scripts/sync-linkedin-newsletter.js; node build.js && node scripts/validate-dist.js && node scripts/validate-routes.js && node scripts/newsletter-inventory.js && node scripts/capture-corner-inventory.js && node scripts/qa-contrast-scan.js && node scripts/validate-agency-parity.js && node scripts/validate-agency-profiles.js && node scripts/validate-contract-tracker.js && node scripts/scan-pii.js && node scripts/validate-no-scrubbed-stubs.js && node scripts/validate-ask-mmt-coverage.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Ensure non-require'd data files ship inside every function bundle.
  # The MMT content corpus + IDIQ dataset + contracts + capture intel
  # are loaded at runtime via fs.readFileSync, which esbuild can't
  # trace automatically — they must be listed here or Ask MMT, Signal
  # Chain, and premium-chat come up with an empty corpus.
  included_files = [
    "netlify/functions/data/**",
    "contracts.json",
    "capture-intelligence.json",
    "data/idiq-vehicles.json",
    "data/premium/agency-profiles/agencies.json",
    "data/may-15-release/**",
    "data/may-17-release/**",
    "data/may-19-release/**",
    "data/may-22-release/**",
    "data/may-26-release/**",
    "data/may-27-release/**",
    "data/may-29-release/**",
    "data/jun-2-release/**",
    "data/jun-5-release/**",
    "data/jun-9-release/**",
    "data/jun-12-release/**",
    "content/friday-brief/**",
    "migrations/010_subscriber_context_alignment.sql",
    "migrations/011_mp_users_columns_documented.sql",
    "static/lead-magnets/**",
    "data/agent-access-launch/**",
  ]

[[edge_functions]]
  function = "security-headers"
  path = "/*"

[functions."score-deck"]
  external_node_modules = ["file-type"]

[functions."score-deck-background"]
  external_node_modules = ["file-type"]

[functions."weekly-report"]
  schedule = "0 14 * * 1"

# Agent Access — nightly recommendation scoring (Phase 4). Feeds
# recommended_cache. No-op until AGENT_SCORING_ENABLED=true AND provider keys
# land (the router is fail-closed), so the cron is safe to register now.
[functions."agent-score-batch"]
  schedule = "0 7 * * *"

# Agent Access — abuse/harvest alert sweep (Phase 5, §5). No-op until
# AGENT_ALERTS_ENABLED=true. Hourly (Netlify's smallest reliable cadence here);
# tighten if real-time §5 detection is needed once traffic exists.
[functions."agent-alert-sweep"]
  schedule = "0 * * * *"

# Agent Access LAUNCH emails — one-shot. Every 10 min so they fire shortly
# after deploy, then the date-guard + idempotency make every later tick a
# no-op. Kill switches: AGENT_LAUNCH_DISABLED (premium) / AGENT_FREE_DISABLED
# (free). RETIRE both crons + functions after they have sent.
[functions."agent-access-premium-send"]
  schedule = "*/10 * * * *"

[functions."agent-access-free-send"]
  schedule = "*/10 * * * *"

# Feature-vote Day-7 tally — hourly; the fn checks now >= deadline and
# exits no-op until the 7-day window closes, then runs once (idempotent).
[functions."feature-vote-tally"]
  schedule = "0 * * * *"

# Feature-vote roadmap auto-release — hourly. Ships the next due feature
# (flag flip + rebuild + announcement). No-op unless a queued row is due
# AND VOTE_AUTOPILOT != off.
[functions."feature-roadmap-release"]
  schedule = "0 * * * *"

# Feature-vote custom_watchlists (F) + recompete_alerts (G) — daily 7 AM ET
# (12:00 UTC). DORMANT: no-ops and sends NOTHING unless the
# vote_feature.custom_watchlists flag is enabled AND VOTE_AUTOPILOT != off.
# The roadmap-release scheduler flips that flag on the feature's ship date.
[functions."watchlist-alert"]
  schedule = "0 12 * * *"

# Premium Friday Brief — every Friday at 6 AM ET (10:00 UTC during EDT).
# Auto-sends the newest unsent content/friday-brief/YYYY-MM-DD.md to all active
# premium subscribers via Resend. Publish = drop a markdown file in that folder.
[functions."premium-brief-send"]
  schedule = "0 10 * * 5"

# Premium Monthly Brief — SUNSET 2026-06-01. The monthly cadence folded into
# Capture Intelligence Sheets (delivered via Capture Corner / Friday Brief), so
# this cron is disabled to stop the retired series from emailing subscribers.
# Function code retained; back issues remain readable at /premium/monthly/:slug.
[functions."monthly-brief-send"]
  # schedule = "0 11 1 * *"

