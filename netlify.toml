# Security headers are intentionally NOT defined here. Ownership (Sprint B
# 2026-05-13, re-confirmed 2026-06-15): X-Frame-Options, X-Content-Type-Options,
# and Referrer-Policy live in `_headers`; Content-Security-Policy,
# Permissions-Policy, and Strict-Transport-Security live in the
# `security-headers` edge function (path "/*", covers function routes too).
# A duplicate `[[headers]] for="/*"` block used to live here with a STALE CSP
# (old jsdelivr + *.stripe.com wildcard) that the edge function silently
# overrode — dead weight and a divergence risk. Removed so the two owners
# above are the single source of truth.

# Cache headers
[[headers]]
  for = "/styles/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    # Short-cache JS so deploys reach users without a hard refresh.
    # The site's JS files (mmt-paywall.js, nav-active.js, support-widget.js,
    # etc.) ship under stable URLs — they aren't fingerprinted per build —
    # so the previous `max-age=31536000, immutable` permanently pinned
    # users to the deploy-day version of each script. Symptom: the
    # 2026-05-06 keyContacts renderer in mmt-paywall.js shipped to
    # production but premium users continued running the pre-deploy
    # cached copy until they hard-refreshed. 5-minute browser cache +
    # 10-minute CDN cache + must-revalidate balances responsiveness
    # against load on the origin. If we later move to fingerprinted
    # filenames, this rule can go back to immutable.
    Cache-Control = "public, max-age=300, s-maxage=600, must-revalidate"

