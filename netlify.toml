[build]
  publish = "dist"
  # Newsletter sync runs before build; set BUTTONDOWN_API_KEY env var for richer data.
  # validate-dist.js fails the build if dist/ contains any public-facing
  # drift pattern from docs/site-spec.md §14a. If it exits non-zero,
  # Netlify will refuse to deploy.
  command = "node scripts/sync-newsletters.js; node scripts/sync-linkedin-newsletter.js; node build.js && node scripts/validate-dist.js && node scripts/validate-routes.js && node scripts/newsletter-inventory.js && node scripts/capture-corner-inventory.js && node scripts/qa-contrast-scan.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Ensure non-require'd data files ship inside every function bundle.
  # The MMT content corpus + IDIQ dataset + contracts + capture intel
  # are loaded at runtime via fs.readFileSync, which esbuild can't
  # trace automatically — they must be listed here or Ask MMT, Signal
  # Chain, and premium-chat come up with an empty corpus.
  included_files = [
    "netlify/functions/data/**",
    "contracts.json",
    "capture-intelligence.json",
    "data/idiq-vehicles.json",
    "data/may-1-release/**",
    "data/may-5-release/**",
    "data/may-6-release/**",
    "data/may-8-release/**",
    "data/apr-29-release/**",
    "migrations/010_subscriber_context_alignment.sql",
    "migrations/011_mp_users_columns_documented.sql",
    "static/lead-magnets/**",
  ]

[[edge_functions]]
  function = "security-headers"
  path = "/*"

[functions."score-deck"]
  external_node_modules = ["file-type"]

[functions."score-deck-background"]
  external_node_modules = ["file-type"]

[functions."weekly-report"]
  schedule = "0 14 * * 1"

# Premium Friday Brief — every Friday at 6 AM ET (11:00 UTC)
# Emails the latest brief to all active premium subscribers via Resend
[functions."premium-brief-send"]
  schedule = "0 11 * * 5"

# Premium Monthly Brief — 1st of month at 6 AM ET (11:00 UTC)
# Emails the monthly intelligence brief to premium subscribers
[functions."monthly-brief-send"]
  schedule = "0 11 1 * *"

# Premium Digest — daily at 6:30 AM ET (11:30 UTC)
# Personalized notification digest based on subscriber preferences
[functions."premium-digest-send"]
  schedule = "30 11 * * *"

[functions."rebuild-trigger"]
  schedule = "0 */4 * * *"

[functions."contract-intel-refresh"]
  schedule = "0 11 * * *"

# Single-Bidder Contracts refresh — 1st of month at 6 AM ET (11:00 UTC).
# Sprint 4 MMT-402. Pulls SAM.gov awards with numberOfOffersReceived=1
# across DHA/VA/HHS/ARPA-H/CMS/ONC for the past 12 months, writes
# data/single-bidder.json for /premium/single-bidder.html.
[functions."refresh-single-bidder"]
  schedule = "0 11 1 * *"

# LinkedIn newsletter sync — Tue/Fri at 6 PM ET (23:00 UTC)
# Searches for new Mission Meets Tech articles, creates markdown stubs via GitHub API, triggers rebuild
[functions."newsletter-sync"]
  schedule = "0 23 * * 2,5"

# Buttondown newsletter send — runs 30 min after newsletter-sync (Tue/Fri 11:30 PM UTC)
# Checks for new articles from the last 3 days and sends a digest to subscribers
[functions."newsletter-send"]
  schedule = "30 23 * * 2,5"

# SAM.gov opportunities can post/close within days — 4hr polling
[functions."opportunity-radar"]
  schedule = "0 */4 * * *"

[functions."sb-vehicle-radar"]
  schedule = "0 13 * * *"

# GAO protest case status checks — daily 12:00 UTC (8 AM ET)
# Iterates active rows in protest_monitor table; updates status,
# emails Mary on change. Premium digest reads protest_monitor.last_checked
# to surface recent updates.
[functions."protest-monitor"]
  schedule = "0 12 * * *"

[functions."score-cleanup"]
  schedule = "*/30 * * * *"

[functions."health-check"]
  schedule = "0 */6 * * *"

# MarketPulse stuck-job reconciliation — daily at 03:00 UTC
# Retries retryable-failed orders up to 3x, dead-letters on cap
[functions."reconcile-marketpulse-scheduled"]
  schedule = "0 3 * * *"

# Capture Corner Premium portal publisher — every 5 min
# Flips premium_deliverables.published=true when publish_at <= now
[functions."scheduled-portal-publisher"]
  schedule = "*/5 * * * *"

# Capture Corner Premium email worker — every 5 min
# Picks up due scheduled_emails rows, sends via Resend, handles retry
[functions."scheduled-email-worker"]
  schedule = "*/5 * * * *"

# Capture Corner nightly metrics — 04:00 UTC (11 PM ET)
[functions."capture-corner-metrics-scheduled"]
  schedule = "0 4 * * *"

# Pursuit Calendar — every 6h, polls PURSUIT_FEEDS and upserts
# pursuit_calendar rows.
[functions."pursuit-calendar-refresh"]
  schedule = "0 */6 * * *"

# Pursuit Calendar — daily 06:00 UTC, expires past-date pursuit_calendar
# rows and archives rows >30d expired.
[functions."pursuit-calendar-sweep"]
  schedule = "0 6 * * *"

# Capture Corner one-shot: April 21, 2026 at 9 AM EDT (= 13:00 UTC)
# Cron fires annually on April 21; the function gates on SCHEDULED_DATE
# so it only actually sends in the configured year. Ops_ledger dedup
# prevents double-sends.
[functions."capture-corner-send"]
  schedule = "0 13 21 4 *"

