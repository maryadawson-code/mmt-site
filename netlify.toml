# so the static /premium/calendar surface picks up the new seed.
# Required env: GITHUB_TOKEN (contents:write), NETLIFY_BUILD_HOOK_URL.
[functions."pursuit-calendar-seed-refresh"]
  schedule = "0 10 * * 1"

# Intel pipeline weekly health report — MMT-INTEL-02. Fridays 10:00 UTC
