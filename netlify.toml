# Weekly org-chart pulse (Mondays 11:00 UTC = 07:00 ET). Hashes the
# canonical agency leadership pages and emails Mary if the content
# has changed since last week. First run seeds the baseline silently.
[functions."org-chart-monitor"]
  schedule = "0 11 * * 1"

# Daily SAM.gov key-expiration watch (10:00 ET = 14:00 UTC). Emails Mary
# at 30 / 14 / 7 / 3 / 1 days before the SAM_GOV_API_KEY expires (and
# daily once expired) so Ask MMT's SAM.gov layer doesn't go dark.
# Update SAM_KEY_EXPIRES_UTC inside the function each time the key
# is regenerated.
[functions."sam-key-expiration-reminder"]
  schedule = "0 14 * * *"

# May 1, 2026 release automations — date-guarded inside each function;
# the daily cron is harmless on every other day.
[functions."may1-premium-capture-send"]
  schedule = "0 10 * * *"

[functions."may1-build-trigger"]
  schedule = "0 13 * * *"

[functions."may1-tracker-trigger"]
  schedule = "0 16 * * *"

# May 6, 2026 release — "The Formulary Storm" Premium issue (DoD P&T
# Committee meets May 6-7; UFBAP advisory committee pause). Daily cron
# at 10:00 UTC (06:00 ET); the function gates on RUN_DATE_UTC=2026-05-06
# and exits on every other day. Idempotency-keyed in ops_events.
[functions."may6-premium-formulary-send"]
  schedule = "0 10 * * *"

# May 8, 2026 release — "COMP/PSCP — Vendors, Vehicles, and the
# Mandatory Floor That Lives in One Subaccount." Capture Corner email
# blast to premium subscribers. Daily cron at 10:00 UTC (06:00 ET);
# the function gates on RUN_DATE_UTC=2026-05-08 and exits on every
# other day. Idempotency-keyed in ops_events as may8_premium_capture_sent.
# Kill switch: MAY8_PREMIUM_CAPTURE_DISABLED=true.
[functions."may8-premium-capture-send"]
  schedule = "0 10 * * *"

# Hourly Stripe -> mp_users safety-net sync.
# Stripe Payment Links (the pricing page checkout) periodically produce
# subscriptions whose webhook events never reach /.netlify/functions/
# stripe-webhook (verified 2026-05-05: 14d window with 12+ active subs
# and zero stripe_subscription rows in ops_events). This cron pulls
# the truth from Stripe hourly and upserts any MMT premium subscriber
# missing from mp_users. Never downgrades — that stays the webhook's
# job (subscription.deleted). Belt-and-suspenders to the webhook,
# documented in CLAUDE.md sprint 2026-05-05.
[functions."stripe-subscriber-sync"]
  schedule = "15 * * * *"
  external_node_modules = ["stripe"]

