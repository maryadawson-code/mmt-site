providers:
  local_primary:
    type: ollama
    base_url: http://localhost:11434
    models:
      large: gemma3:27b
      medium: gemma3:12b
      small: gemma3:4b
    cost_per_token: 0.00

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    models:
      primary: claude-sonnet-4-5
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    reserved_for:
      - reasoning_complex
      - proposal_writing
      - sensitive_review

routing_default: local_primary
