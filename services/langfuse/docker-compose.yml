# Self-hosted Langfuse for Digital Mary eval observability.
# DM-001 (Sprint P0-1, 2026-05-07).
#
# Deploy via Fly.io:
#   cd services/langfuse
#   fly launch --no-deploy
#   fly secrets set NEXTAUTH_SECRET=$(openssl rand -base64 32) \
#                   SALT=$(openssl rand -base64 32) \
#                   ENCRYPTION_KEY=$(openssl rand -hex 32) \
#                   DATABASE_URL=$SUPABASE_DB_URL
#   fly deploy
#
# After first boot: create a project at https://<app>.fly.dev/, generate
# LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY, paste into .env (and Netlify
# env vars for the eval harness).

version: "3.9"
services:
  langfuse:
    image: langfuse/langfuse:latest
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LANGFUSE_INIT_ORG_ID: missionmeetstech
      LANGFUSE_INIT_ORG_NAME: "Mission Meets Tech"
      LANGFUSE_INIT_PROJECT_ID: digital-mary
      LANGFUSE_INIT_PROJECT_NAME: "Digital Mary"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse_local_dev}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data

volumes:
  langfuse_pg:
